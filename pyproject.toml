[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ktrans"
version = "1.0.0"
description = "Research toolkit for multi-agent LLM literary translation (Korean to English) and its automated evaluation"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Beatrice Donna Valentina Dell'Omo" }]
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
kt = "kt.cli:main"

[tool.setuptools.packages.find]
include = ["kt*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
